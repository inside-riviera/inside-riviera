<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Riviera Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Your event cards container -->
    <div id="events-container"></div>

    <!-- PASTE THE JAVASCRIPT CODE HERE -->
    <script>
      function getEventImage(event) {
        if (event.image && event.image.trim() !== "" && event.image !== "default.png") {
          return event.image.startsWith("http") ? event.image : "images/" + event.image;
        }
        
        var category = (event.category || "").toLowerCase();
        var title = (event.title || "").toLowerCase();
        
        if (category.includes("food") || category.includes("gourmet") || title.includes("food")) {
          return "images/category-food.jpg";
        } 
        else if (category.includes("culture") || category.includes("art") || title.includes("exposition")) {
          return "images/category-culture.jpg";
        } 
        else if (category.includes("sport") || title.includes("grand prix")) {
          return "images/category-sports.jpg";
        } 
        else if (category.includes("festival") || title.includes("halloween")) {
          return "images/category-festival.jpg";
        }
        
        return "images/default-card.jpg";
      }

      function renderEvents(eventsArray) {
        var container = document.getElementById("events-container");
        if (!container) return;
        
        container.innerHTML = "";
        
        eventsArray.forEach(function(event) {
          var resolvedImage = getEventImage(event);
          
          var cardHTML = `
            <div class="event-card">
              <div class="event-image-container">
                <span class="event-category-badge">${event.category || 'EVENT'}</span>
                <img src="${resolvedImage}" alt="${event.title || 'Event Image'}" onerror="this.src='images/default-card.jpg';">
              </div>
              <div class="event-content">
                <h3>${event.title}</h3>
                <p>${event.dates} | ${event.time || ''}</p>
                <a href="${event.officialWebsiteLink}" target="_blank">Visit Official Website</a>
              </div>
            </div>
          `;
          container.innerHTML += cardHTML;
        });
      }
    </script>
</body>
</html>
