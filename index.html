<style>
      /* =========================================================
         EXACT MATCH HERO & HEADER STYLES
         ========================================================= */
      .hero {
        position: relative;
        background: linear-gradient(rgba(15, 23, 42, 0.15), rgba(15, 23, 42, 0.25)),
                    url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80') center / cover no-repeat;
        padding: 22px 40px 140px 40px;
        color: #ffffff;
      }

      .top-nav-bar {
        max-width: 1250px;
        margin: 0 auto 50px auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand-group {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }

      .logo-graphic {
        width: 26px;
        height: 22px;
        fill: var(--accent-green);
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        flex-shrink: 0;
      }

      .brand-title {
        font-size: 1.1rem;
        font-weight: 900;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: #ffffff;
        text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      }

      /* Exact center alignment for Events Places Lifestyle */
      .top-center-links {
        display: flex;
        align-items: center;
        gap: 32px;
        margin-left: auto;
        margin-right: 180px;
      }

      .top-center-links button {
        background: none;
        border: none;
        color: #ffffff;
        font-size: 0.88rem;
        font-weight: 400;
        cursor: pointer;
        opacity: 0.9;
        letter-spacing: 0.3px;
        text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        transition: opacity 0.2s ease;
      }

      .top-center-links button:hover {
        opacity: 1;
      }

      .top-right-icons {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .icon-btn {
        background: none;
        border: none;
        color: #ffffff;
        font-size: 1rem;
        cursor: pointer;
        text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hero-inner-content {
        position: relative;
        max-width: 850px;
        margin: 0 auto;
        padding-left: 10px;
      }

      /* Small uppercase breadcrumb style */
      .brand-tagline {
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 3.5px;
        color: #ffffff;
        text-transform: uppercase;
        opacity: 0.85;
        margin-bottom: 4px;
        text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      }

      .whats-on-label {
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #ffffff;
        text-transform: uppercase;
        opacity: 0.9;
        margin-bottom: 2px;
        text-shadow: 0 1px 4px rgba(0,0,0,0.3);
      }

      .hero .highlight {
        display: block;
        font-size: 3.8rem;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: 2px;
        margin-bottom: 10px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        line-height: 1;
      }

      .hero p {
        font-size: 0.88rem;
        max-width: 580px;
        opacity: 0.92;
        line-height: 1.45;
        text-shadow: 0 1px 4px rgba(0,0,0,0.3);
      }

      .hero-script-watermark {
        position: absolute;
        right: 40px;
        bottom: -20px;
        font-family: "Brush Script MT", cursive, sans-serif;
        font-size: 2.3rem;
        color: #ffffff;
        opacity: 0.9;
        transform: rotate(-6deg);
        text-shadow: 0 2px 6px rgba(0,0,0,0.3);
        pointer-events: none;
      }

      .hero-script-watermark span {
        display: block;
        font-size: 1.1rem;
        text-align: right;
        margin-top: -5px;
