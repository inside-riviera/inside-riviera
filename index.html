<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inside Riviera Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Your events container where the cards will appear -->
    <div id="events-container"></div>

    <!-- PASTE THE CODE RIGHT HERE -->
    <script>
      function getEventImage(event) {
        var imgField = event.image || event["Official Image (.png / .jpg)"] || "";
        
        if (imgField.trim() !== "" && imgField !== "default.png") {
          return imgField.startsWith("http") ? imgField : "images/" + imgField;
        }
        
        var title = (event.title || event["Title of the Event"] || "").toLowerCase();
        var category = (event.category || event["Category"] || "").toLowerCase();
        var city = (event.city || event["City"] || "").toLowerCase();
        
        if (title.includes("yacht") || title.includes("boat") || city.includes("monaco")) {
          return "https://images.unsplash.com/photo-1569263979104-865ab9cd8d5c?auto=format&fit=crop&w=800&q=80";
        } 
        else if (category.includes("food") || title.includes("food") || title.includes("gourmet") || title.includes("tasting")) {
          return "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80";
        } 
        else if (category.includes("sport") || title.includes("sport") || title.includes("race")) {
          return "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=800&q=80";
        } 
        else if (category.includes("culture") || title.includes("patrimoine") || title.includes("exposition") || title.includes("museum")) {
          return "https://images.unsplash.com/photo-1565060604153-443b7bc45479?auto=format&fit=crop&w=800&q=80";
        } 
        else if (category.includes("concert") || category.includes("music") || title.includes("live") || title.includes("jazz")) {
          return "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=800&q=80";
        }
        
        return "https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=800&q=80";
      }

      function renderEvents(eventsArray) {
        var container = document.getElementById("events-container");
        if (!container) return;
        
        container.innerHTML = "";
        
        eventsArray.forEach(function(event) {
          var eventImage = getEventImage(event);
          
          var cardHTML = `
            <div class="event-card">
              <div class="event-image-container">
                <span class="event-category-badge">${event.category || event["Category"] || 'EVENT'}</span>
                <img src="${eventImage}" alt="${event.title || event["Title of the Event"] || 'Event Image'}" onerror="this.src='https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=800&q=80';">
              </div>
              <div class="event-content">
                <h3>${event.title || event["Title of the Event"]}</h3>
                <p class="event-address"><i class="fas fa-map-marker-alt"></i> ${event.address || event["Address"] || event.city || event["City"] || ''}</p>
                <p class="event-time"><i class="fas fa-clock"></i> ${event.dates || event["Dates (including Year)"] || ''} | ${event.time || event["Time"] || ''}</p>
                <p class="event-description">${event.description || event["Description"] || ''}</p>
                <a href="${event.officialWebsiteLink || event["Official Website Link"]}" target="_blank" class="btn-official-site">Visit Official Website</a>
              </div>
            </div>
          `;
          container.innerHTML += cardHTML;
        });
      }
    </script>
</body>
</html>
