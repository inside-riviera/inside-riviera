name: Priority 4 performance and outage checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/priority4-checks.yml'
      - 'index.html'
      - 'homepage.css'
      - 'event.html'
      - 'images/**'
      - '*.jpg'
      - '*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Convert referenced local photos and minify homepage CSS
        run: |
          python -m pip install --quiet Pillow rcssmin
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('.')
          text_files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.css','.js','.json'} and '.git' not in p.parts]
          texts = {p: p.read_text(encoding='utf-8') for p in text_files}
          candidates = []
          social_texts = [text for text in texts.values() if 'og:image' in text or 'twitter:image' in text]
          for p in root.rglob('*.jpg'):
              rel = p.as_posix()
              if rel == 'halloween-2026-share.jpg':
                  continue
              if any(rel in text for text in texts.values()):
                  candidates.append(p)
          converted = 0
          before = after = 0
          jpeg_optimized = 0
          for src in candidates:
              rel = src.as_posix()
              is_social = any(rel in text for text in social_texts)
              if is_social:
                  temp = src.with_name(src.stem + '.optimized.jpg')
                  with Image.open(src) as im:
                      im.convert('RGB').save(temp, 'JPEG', quality=88, optimize=True, progressive=True)
                  if temp.stat().st_size < src.stat().st_size:
                      before += src.stat().st_size
                      after += temp.stat().st_size
                      temp.replace(src)
                      jpeg_optimized += 1
                  else:
                      temp.unlink()
                  continue
              dst = src.with_suffix('.webp')
              with Image.open(src) as im:
                  im.convert('RGB').save(dst, 'WEBP', quality=80, method=6)
              before += src.stat().st_size
              after += dst.stat().st_size
              converted += 1
              old, new = src.as_posix(), dst.as_posix()
              for p, text in texts.items():
                  if old in text:
                      texts[p] = text.replace(old, new)
          png_optimized = 0
          for src in root.rglob('*.png'):
              temp = src.with_name(src.stem + '.optimized.png')
              with Image.open(src) as im:
                  im.save(temp, 'PNG', optimize=True)
              if temp.stat().st_size < src.stat().st_size:
                  temp.replace(src)
                  png_optimized += 1
              else:
                  temp.unlink()
          for p, text in texts.items():
              if p.as_posix() in {'homepage.css'}:
                  import rcssmin
                  text = rcssmin.cssmin(text)
              if text != p.read_text(encoding='utf-8'):
                  p.write_text(text, encoding='utf-8')
          print(f'Converted {converted} inline JPG images to WebP; optimized {jpeg_optimized} social JPEGs and {png_optimized} PNGs; bytes before={before}; after={after}; saved={before-after}.')
          PY
      - name: Install browser test tools
        run: |
          npm init -y
          npm install --no-save playwright lighthouse
          npx playwright install --with-deps chromium
      - name: Run outage tests against the site files
        run: |
          python -m http.server 8080 > /tmp/inside-riviera-http.log 2>&1 &
          echo $! > /tmp/inside-riviera-http.pid
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true, args:['--no-sandbox']});
            const page = await browser.newPage();
            await page.route('**/*sheetdb.io/**', route => route.abort());
            await page.goto('http://127.0.0.1:8080/', {waitUntil:'domcontentloaded'});
            await page.evaluate(() => localStorage.clear());
            await page.reload({waitUntil:'domcontentloaded'});
            await page.getByText('Live event updates are temporarily unavailable', {exact:false}).waitFor({timeout:20000});
            const dayCells = await page.locator('#days-grid .day-cell').count();
            if (dayCells < 28) throw new Error('Calendar grid did not render for a first-time visitor.');
            console.log('PASS: first-time visitor sees a working calendar and a clear no-cache outage message.');
            await page.evaluate(() => {
              const today = new Date();
              localStorage.setItem('insideRivieraEventsCacheV1', JSON.stringify([{
                title:'Offline test event', city:'Sanremo', location:'Test venue',
                time:'18:00', description:'Automated outage test', link:'', categories:['Live Music'], priority:'1',
                year:today.getFullYear(), month:today.getMonth(), date:today.getDate(),
                endYear:today.getFullYear(), endMonth:today.getMonth(), endDate:today.getDate(), img:''
              }]));
              localStorage.setItem('insideRivieraEventsCacheTimeV1', new Date().toISOString());
            });
            await page.reload({waitUntil:'domcontentloaded'});
            await page.getByText('Showing your last saved event list', {exact:false}).waitFor({timeout:20000});
            await page.getByRole('heading', {name:'Offline test event'}).waitFor({timeout:20000});
            console.log('PASS: returning visitor sees cached event listings during outage.');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
      - name: Run Lighthouse mobile audit
        run: |
          npx lighthouse http://127.0.0.1:8080/ --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --screenEmulation.mobile --output=json --output-path=./lighthouse-mobile.json --chrome-flags="--headless --no-sandbox"
      - name: Summarize mobile Lighthouse metrics
        if: always() && hashFiles('lighthouse-mobile.json') != ''
        run: |
          node <<'JS'
          const fs = require('fs');
          const l = JSON.parse(fs.readFileSync('lighthouse-mobile.json', 'utf8'));
          const a = l.audits || {};
          const fmt = (id, unit='ms') => {
            const v = a[id]?.numericValue;
            return Number.isFinite(v) ? (unit === 'ms' ? (v/1000).toFixed(2)+' s' : v.toFixed(3)) : 'not reported';
          };
          const score = id => Number.isFinite(l.categories?.[id]?.score) ? Math.round(l.categories[id].score*100)+'/100' : 'not reported';
          const report = [
            '# Mobile Lighthouse report',
            '',
            'Generated by GitHub Actions for the local site build.',
            '',
            '| Measure | Result |',
            '|---|---:|',
            '| Performance | '+score('performance')+' |',
            '| Accessibility | '+score('accessibility')+' |',
            '| Best practices | '+score('best-practices')+' |',
            '| SEO | '+score('seo')+' |',
            '| First Contentful Paint | '+fmt('first-contentful-paint')+' |',
            '| Largest Contentful Paint | '+fmt('largest-contentful-paint')+' |',
            '| Total Blocking Time | '+fmt('total-blocking-time')+' |',
            '| Cumulative Layout Shift | '+fmt('cumulative-layout-shift','score')+' |',
            '| Speed Index | '+fmt('speed-index')+' |',
            '',
            'This is a Lighthouse lab run, not field Core Web Vitals. Real-user INP and CrUX field data are reported separately when Google has sufficient traffic.'
          ].join('\n');
          fs.writeFileSync('priority4-lighthouse-summary.md', report);
          console.log(report);
          JS
      - name: Commit image and CSS optimizations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add -- ':(glob)**/*.webp' priority4-lighthouse-summary.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Optimize referenced images and minify homepage CSS"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: priority-4-lighthouse-mobile
          path: lighthouse-mobile.json
          if-no-files-found: ignore
