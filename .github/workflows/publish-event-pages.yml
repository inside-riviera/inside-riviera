name: Publish individual event pages

on:
  schedule:
    - cron: "25 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate pages from the events spreadsheet
        run: python generate_event_pages.py
      - name: Commit updated event pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add event-*.html event-pages-manifest.json sitemap.xml
          git diff --cached --quiet || git commit -m "Publish individual upcoming event pages"
          git push
