name: Auto-Update Events

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6:00 AM UTC
  workflow_dispatch: 

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the script to commit updates back to your repo
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "Event Bot"
          git config --global user.email "bot@example.com"
          git add events.json
          git commit -m "Automated event data update" || exit 0
          git push
