<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Event details | Inside Riviera</title><meta name="description" content="Discover Riviera event details and official organiser information."><link rel="icon" href="/favicon.png"><style>:root{font-family:Arial,sans-serif;color:#142037;background:#f8fafc}*{box-sizing:border-box}body{margin:0}header{background:#142037;color:white;padding:20px max(20px,calc((100vw - 1000px)/2))}header a{color:white;text-decoration:none;font-weight:bold}main{max-width:850px;margin:35px auto;padding:0 20px}.back{color:#c60069;text-decoration:none}.panel{background:white;border-radius:18px;padding:28px;box-shadow:0 8px 32px #14203712;margin-top:20px}h1{font-size:clamp(28px,5vw,46px);margin:12px 0}p{line-height:1.65}.meta{color:#52617a}.button{display:inline-block;background:#ff007a;color:white;text-decoration:none;padding:14px 20px;border-radius:9px;font-weight:bold;margin-top:16px}.button[hidden]{display:none}.hero{width:100%;max-height:380px;object-fit:cover;border-radius:12px}.note{font-size:13px;color:#61708a}footer{text-align:center;padding:30px}footer a{color:#52617a;margin:0 8px}</style></head><body><header><a href="/">INSIDE RIVIERA</a></header><main><a class="back" href="/">← Back to events calendar</a><article class="panel" id="content"><p>Loading event details…</p></article></main><footer><a href="/about.html">About</a><a href="/contact.html">Contact</a><a href="/privacy-policy.html">Privacy policy</a></footer><script>
const el=document.getElementById('content');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=(r,names)=>{for(const n of names){const k=n.replace(/[\s_-]/g,'').toLowerCase();if(r[k]!==undefined&&r[k]!==null&&String(r[k]).trim())return r[k]}return ''};
const dateString=(y,m,d)=>{const a=[Number(y),Number(m),Number(d)];if(a.every(Number.isFinite)&&a[0]>2000&&a[1]>=1&&a[1]<=12&&a[2]>=1&&a[2]<=31)return new Date(a[0],a[1]-1,a[2]).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return ''};
(async()=>{try{const id=Number(new URLSearchParams(location.search).get('id'));if(!Number.isSafeInteger(id)||id<0)throw Error('Invalid event');const res=await fetch('https://sheetdb.io/api/v1/nxxtx0pb2uuw7');if(!res.ok)throw Error('Events unavailable');const data=await res.json();if(!Array.isArray(data)||!data[id])throw Error('Event not found');const r={};Object.entries(data[id]).forEach(([k,v])=>r[k.replace(/[\s_-]/g,'').toLowerCase()]=v);const title=get(r,['title','titolo','name','event'])||'Riviera event';const city=get(r,['city','citta','town']);const venue=get(r,['venue','location','luogo','address','place']);const time=get(r,['time','orario','hours','ora']);const desc=get(r,['description','desc','descrizione','details','info']);const url=get(r,['link','url','website','sito','ticketlink']);const start=dateString(get(r,['startyear','year','anno','yr']),get(r,['startmonth','month','mese','mo']),get(r,['startdate','day','giorno','data']));const end=dateString(get(r,['endyear','endanno']),get(r,['endmonth','endmese']),get(r,['enddate','endgiorno']));const img=get(r,['img','image','photo','picture','foto','imgurl','imageurl']);const safeUrl=u=>{try{const a=new URL(String(u),location.href);return ['https:','http:'].includes(a.protocol)?a.href:''}catch{return ''}};const photo=safeUrl(img),official=safeUrl(url);document.title=title+' | Inside Riviera';el.innerHTML=`${photo?`<img class="hero" src="${esc(photo)}" alt="${esc(title)}" onerror="this.style.display='none'">`:''}<h1>${esc(title)}</h1><p class="meta">${start?'📅 '+esc(start):''}${end&&end!==start?' – '+esc(end):''}</p><p class="meta">${city?'📍 '+esc(city):''}${venue?' · '+esc(venue):''}</p>${time?`<p class="meta">🕒 ${esc(time)}</p>`:''}<h2>About this event</h2><p>${esc(desc||'For the latest event details, check the organiser’s official website.').replace(/\n/g,'<br>')}</p>${official?`<a class="button" href="${esc(official)}" target="_blank" rel="noopener noreferrer">Visit official event website ↗</a>`:''}<p class="note">Event details may change. Confirm times, prices and availability with the organiser before travelling.</p>`}catch(e){el.innerHTML='<h1>Event unavailable</h1><p>We couldn’t load this event. Please return to the calendar and try again.</p>'}})();
</script></body></html>
